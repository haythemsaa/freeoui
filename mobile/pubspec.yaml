name: freeoui
description: FreeOui - Plateforme d'avantages et promotions de proximité
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.3.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter

  # State Management
  flutter_riverpod: ^2.5.1
  riverpod_annotation: ^2.3.5

  # Networking
  dio: ^5.4.3+1
  retrofit: ^4.1.0
  pretty_dio_logger: ^1.3.1

  # Local Storage
  sqflite: ^2.3.3+1
  hive: ^2.2.3
  hive_flutter: ^1.1.0
  path_provider: ^2.1.3
  flutter_secure_storage: ^9.2.2

  # Maps & Geolocation
  google_maps_flutter: ^2.6.1
  mapbox_maps_flutter: ^1.1.0
  geolocator: ^12.0.0
  flutter_background_geolocation: ^4.15.2
  geocoding: ^3.0.0

  # Firebase
  firebase_core: ^2.31.0
  firebase_messaging: ^14.9.2
  firebase_analytics: ^10.10.5
  firebase_crashlytics: ^3.5.5

  # QR Code
  qr_flutter: ^4.1.0
  qr_code_scanner: ^1.0.1
  mobile_scanner: ^5.1.1

  # UI Components
  flutter_svg: ^2.0.10+1
  cached_network_image: ^3.3.1
  shimmer: ^3.0.0
  lottie: ^3.1.2
  flutter_spinkit: ^5.2.1
  pull_to_refresh: ^2.0.0

  # Utilities
  intl: ^0.19.0
  timeago: ^3.6.1
  url_launcher: ^6.3.0
  share_plus: ^9.0.0
  image_picker: ^1.1.2
  permission_handler: ^11.3.1
  connectivity_plus: ^6.0.3
  device_info_plus: ^10.1.0
  package_info_plus: ^8.0.0

  # Authentication
  flutter_facebook_auth: ^6.2.0
  google_sign_in: ^6.2.1

  # Analytics
  mixpanel_flutter: ^2.3.1

  # Environment
  flutter_dotenv: ^5.1.0

  # Localization
  flutter_localizations:
    sdk: flutter

  # Icons
  cupertino_icons: ^1.0.6
  font_awesome_flutter: ^10.7.0

dev_dependencies:
  flutter_test:
    sdk: flutter

  # Code Generation
  build_runner: ^2.4.9
  retrofit_generator: ^8.1.0
  riverpod_generator: ^2.4.0
  hive_generator: ^2.0.1
  json_serializable: ^6.8.0

  # Linting
  flutter_lints: ^4.0.0
  very_good_analysis: ^6.0.0

  # Testing
  mockito: ^5.4.4
  integration_test:
    sdk: flutter

flutter:
  uses-material-design: true

  assets:
    - assets/images/
    - assets/icons/
    - assets/animations/
    - assets/translations/
    - .env

  fonts:
    - family: Cairo
      fonts:
        - asset: assets/fonts/Cairo-Regular.ttf
        - asset: assets/fonts/Cairo-Bold.ttf
          weight: 700
    - family: Poppins
      fonts:
        - asset: assets/fonts/Poppins-Regular.ttf
        - asset: assets/fonts/Poppins-Medium.ttf
          weight: 500
        - asset: assets/fonts/Poppins-SemiBold.ttf
          weight: 600
        - asset: assets/fonts/Poppins-Bold.ttf
          weight: 700
