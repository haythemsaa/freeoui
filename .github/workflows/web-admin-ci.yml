name: Web Admin CI

on:
  push:
    branches: [ main, develop ]
    paths:
      - 'web-admin/**'
      - '.github/workflows/web-admin-ci.yml'
  pull_request:
    branches: [ main, develop ]
    paths:
      - 'web-admin/**'

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: web-admin/package-lock.json

      - name: Install dependencies
        working-directory: ./web-admin
        run: npm ci

      - name: Run linter
        working-directory: ./web-admin
        run: npm run lint

      - name: Run type check
        working-directory: ./web-admin
        run: npm run type-check || npx tsc --noEmit

      - name: Run tests
        working-directory: ./web-admin
        run: npm test -- --coverage || echo "No tests configured yet"

      - name: Build application
        working-directory: ./web-admin
        run: npm run build

      - name: Upload build artifacts
        uses: actions/upload-artifact@v3
        with:
          name: web-admin-dist
          path: web-admin/dist
          retention-days: 7

  lighthouse:
    runs-on: ubuntu-latest
    needs: build-and-test

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install dependencies
        working-directory: ./web-admin
        run: npm ci

      - name: Build application
        working-directory: ./web-admin
        run: npm run build

      - name: Run Lighthouse CI
        working-directory: ./web-admin
        run: |
          npm install -g @lhci/cli
          lhci autorun || echo "Lighthouse CI not configured"
