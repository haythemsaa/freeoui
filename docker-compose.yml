version: '3.8'

services:
  # PostgreSQL with PostGIS
  postgres:
    image: postgis/postgis:16-3.4
    container_name: freeoui_postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: freeoui_db
      POSTGRES_USER: freeoui_user
      POSTGRES_PASSWORD: freeoui_password_2024
      POSTGRES_HOST_AUTH_METHOD: trust
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./database/migrations:/docker-entrypoint-initdb.d
    networks:
      - freeoui_network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U freeoui_user -d freeoui_db"]
      interval: 10s
      timeout: 5s
      retries: 5

  # Redis
  redis:
    image: redis:7-alpine
    container_name: freeoui_redis
    restart: unless-stopped
    command: redis-server --maxmemory 512mb --maxmemory-policy allkeys-lru --requirepass freeoui_redis_2024
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    networks:
      - freeoui_network
    healthcheck:
      test: ["CMD", "redis-cli", "--raw", "incr", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  # MinIO (S3-compatible storage)
  minio:
    image: minio/minio:latest
    container_name: freeoui_minio
    restart: unless-stopped
    environment:
      MINIO_ROOT_USER: freeoui_minio
      MINIO_ROOT_PASSWORD: freeoui_minio_password_2024
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - minio_data:/data
    command: server /data --console-address ":9001"
    networks:
      - freeoui_network
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 30s
      timeout: 20s
      retries: 3

  # Laravel Backend API
  app:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: freeoui_backend
    restart: unless-stopped
    working_dir: /var/www
    environment:
      - APP_ENV=local
      - APP_DEBUG=true
      - DB_CONNECTION=pgsql
      - DB_HOST=postgres
      - DB_PORT=5432
      - DB_DATABASE=freeoui_db
      - DB_USERNAME=freeoui_user
      - DB_PASSWORD=freeoui_password_2024
      - REDIS_HOST=redis
      - REDIS_PASSWORD=freeoui_redis_2024
      - REDIS_PORT=6379
      - AWS_ENDPOINT=http://minio:9000
      - AWS_ACCESS_KEY_ID=freeoui_minio
      - AWS_SECRET_ACCESS_KEY=freeoui_minio_password_2024
      - AWS_DEFAULT_REGION=us-east-1
      - AWS_BUCKET=freeoui
      - AWS_USE_PATH_STYLE_ENDPOINT=true
    ports:
      - "8000:8000"
    volumes:
      - ./backend:/var/www
      - /var/www/vendor
      - /var/www/node_modules
    networks:
      - freeoui_network
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      minio:
        condition: service_healthy

  # Web Admin (React)
  web-admin:
    build:
      context: ./web-admin
      dockerfile: Dockerfile.dev
    container_name: freeoui_web_admin
    restart: unless-stopped
    ports:
      - "3000:3000"
    volumes:
      - ./web-admin:/app
      - /app/node_modules
    networks:
      - freeoui_network
    environment:
      - VITE_API_URL=http://localhost:8000/api
      - NODE_ENV=development
    depends_on:
      - app

  # Nginx (Reverse Proxy)
  nginx:
    image: nginx:alpine
    container_name: freeoui_nginx
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./docker/nginx/nginx.conf:/etc/nginx/nginx.conf
      - ./docker/nginx/conf.d:/etc/nginx/conf.d
      - ./backend/public:/var/www/public
    networks:
      - freeoui_network
    depends_on:
      - app

volumes:
  postgres_data:
    driver: local
  redis_data:
    driver: local
  minio_data:
    driver: local

networks:
  freeoui_network:
    driver: bridge
