version: '3.8'

services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile.prod
    container_name: freeoui_backend
    restart: unless-stopped
    environment:
      - APP_ENV=production
      - APP_DEBUG=false
      - DB_HOST=postgres
      - REDIS_HOST=redis
    volumes:
      - ./backend:/var/www/html
      - backend_storage:/var/www/html/storage
    networks:
      - freeoui_network
    depends_on:
      - postgres
      - redis

  nginx:
    image: nginx:alpine
    container_name: freeoui_nginx
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./backend:/var/www/html
      - ./docker/nginx/conf.d:/etc/nginx/conf.d
      - ./docker/nginx/ssl:/etc/nginx/ssl
    networks:
      - freeoui_network
    depends_on:
      - backend

  postgres:
    image: postgis/postgis:16-3.4
    container_name: freeoui_postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: freeoui_production
      POSTGRES_USER: ${DB_USERNAME}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - freeoui_network
    ports:
      - "5432:5432"

  redis:
    image: redis:7-alpine
    container_name: freeoui_redis
    restart: unless-stopped
    command: redis-server --appendonly yes --requirepass ${REDIS_PASSWORD}
    volumes:
      - redis_data:/data
    networks:
      - freeoui_network

  queue:
    build:
      context: ./backend
      dockerfile: Dockerfile.prod
    container_name: freeoui_queue
    restart: unless-stopped
    command: php artisan queue:work --tries=3 --timeout=90
    volumes:
      - ./backend:/var/www/html
    networks:
      - freeoui_network
    depends_on:
      - postgres
      - redis

networks:
  freeoui_network:
    driver: bridge

volumes:
  postgres_data:
  redis_data:
  backend_storage:
